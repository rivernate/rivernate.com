<meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px;background:var(--surface-page)}</style>
<div id="root"></div>
<script type="text/babel">
const {ThemeSelector,TerminalWindow,Prompt,Button,Badge,Tag}=window.RivernateDesignSystem_665cb5;
function Demo(){
  const [s,setS]=React.useState({theme:'',font:''});
  React.useEffect(()=>{document.documentElement.setAttribute('data-theme',s.theme);
    if(!s.theme)document.documentElement.removeAttribute('data-theme');},[]);
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',justifyContent:'flex-end'}}><ThemeSelector {...s} onChange={setS}/></div>
    <TerminalWindow title="~/themes" shell="zsh" scanlines>
      <Prompt command={'theme set '+(s.theme||'phosphor')}/>
      <div style={{color:'var(--text-secondary)'}}>applied. every token re-resolved.</div>
      <Prompt command="" caret/>
    </TerminalWindow>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <Button variant="primary">deploy</Button><Button>cancel</Button>
      <Badge tone="accent" dot>ok</Badge><Badge tone="warn">warn</Badge><Badge tone="error">error</Badge>
      <Tag>rust</Tag>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
