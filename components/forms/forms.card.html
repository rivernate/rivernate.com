<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{padding:20px;background:var(--surface-page)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}</style>
<div id="root"></div>
<script type="text/babel">
const NS=window.RivernateDesignSystem_665cb5;
const {Input,Textarea,Select,Checkbox,Switch}=NS;
function Demo(){const [c,setC]=React.useState(true),[s,setS]=React.useState(false);
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
 <div className="col">
  <Input label="handle" prefix="@" defaultValue="rivernate"/>
  <Input label="email" error="not a valid address" defaultValue="river@"/>
  <Select label="sort" options={['newest','oldest','a-z']}/>
 </div>
 <div className="col">
  <Textarea label="message" rows={4} placeholder="say hello"/>
  <div className="row" style={{gap:20}}>
   <Checkbox label="ship it" checked={c} onChange={e=>setC(e.target.checked)}/>
   <Switch label="paper theme" checked={s} onChange={e=>setS(e.target.checked)}/>
  </div>
 </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
